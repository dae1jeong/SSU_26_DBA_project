services:
  backend:
    environment:
      ACADEMY_ALLOWED_ORIGINS: "http://localhost:${BACKEND_PORT:-8000},http://127.0.0.1:${BACKEND_PORT:-8000},${NGROK_URL:?Set NGROK_URL in .env}"

  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?Set NGROK_AUTHTOKEN in .env}
    command: ["http", "http://backend:8000", "--url", "${NGROK_URL:?Set NGROK_URL in .env}"]
    depends_on:
      backend:
        condition: service_healthy
