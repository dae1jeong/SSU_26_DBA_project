services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: math_academy
      MYSQL_USER: academy
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      ACADEMY_MYSQL_READER_PASSWORD: ${ACADEMY_MYSQL_READER_PASSWORD:-}
      TZ: Asia/Seoul
    command: ["--event-scheduler=ON", "--default-time-zone=+09:00"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./setup-reader.sh:/docker-entrypoint-initdb.d/02-setup-reader.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u \"$$MYSQL_USER\" -D math_academy -e 'SELECT student_id FROM student LIMIT 0' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      ACADEMY_MYSQL_HOST: mysql
      ACADEMY_MYSQL_PORT: "3306"
      ACADEMY_MYSQL_DATABASE: math_academy
      ACADEMY_MYSQL_USER: academy
      ACADEMY_MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      ACADEMY_MYSQL_READER_PASSWORD: ${ACADEMY_MYSQL_READER_PASSWORD:-}
      ACADEMY_WEB_READER_PASSWORD: ${ACADEMY_WEB_READER_PASSWORD:-}
      ACADEMY_WEB_PASSWORD: ${ACADEMY_WEB_PASSWORD:-admin}
      ACADEMY_ALLOWED_ORIGINS: ${ACADEMY_ALLOWED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mysql_data:
